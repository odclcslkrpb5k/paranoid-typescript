name: examples

on:
  push:
    branches: [main]
    paths: ["examples/**", ".dockerignore", ".github/workflows/examples.yml"]
  pull_request:
    paths: ["examples/**", ".dockerignore", ".github/workflows/examples.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # A deadline regression hangs a test rather than failing it; this bounds the cost (SV-20).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same service a workstation runs (TC-9): the image build installs from the lockfile and
      # verifies registry signatures (TC-3, TC-7); the check itself runs with no network (TS-1).
      - name: Check, in the examples' own environment
        run: docker compose --file examples/compose.yaml run --build --rm check
